<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MH-AIO - Monster Hunter Encyclopedia</title>
    <!-- F0: preload critical self-hosted fonts (offline, same-origin). Only the
         two critical weights; remaining weights load lazily via @font-face. -->
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/cinzel-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/spectral-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
