name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          # Core Tauri prerequisites (Tauri docs: webkit, gtk, appindicator, librsvg, ssl, xdo, etc.)
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev libgtk-3-dev librsvg2-dev patchelf pkg-config
          # webkit2gtk: try 4.1 (Tauri v2) first, fallback to 4.0 (Ubuntu 22.04 compat)
          sudo apt-get install -y libwebkit2gtk-4.1-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev
          # appindicator: ayatana is new name, libappindicator is legacy fallback
          sudo apt-get install -y libayatana-appindicator3-dev || sudo apt-get install -y libappindicator3-dev || true
          # Verify pkg-config can find gdk and webkit
          pkg-config --modversion gdk-3.0
          pkg-config --modversion webkit2gtk-4.1 || pkg-config --modversion webkit2gtk-4.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Version sync check
        run: node scripts/check-version.js

      - name: SvelteKit sync
        run: npx svelte-kit sync

      - name: Svelte check
        run: npm run check

      - name: ESLint
        run: npm run lint:eslint --if-present

      - name: Prettier check
        run: npm run format:check --if-present

      - name: Rust fmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: npm audit
        run: npm audit --audit-level=moderate
